[project]
name = "campus-library-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
    "openai-agents>=0.24.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
